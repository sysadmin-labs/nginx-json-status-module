# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

RELOAD_HTTP="
    upstream reload_zoned {
        zone reload_zoned 64k;
        server 127.0.0.1:18993 down;
    }"

RELOAD_SERVER='
        location /probe {
            json_status;
        }'

RELOAD_EXPECT=zoned

# A reload that had detached the module would still answer 200, from the
# static handler of the location.  So the probe asks for something only this
# module writes, and for the half that is most likely to break across a
# reload: the upstream with its shared zone.  The peer list lives in shared
# memory that the old cycle allocated, and the module reads it through
# us->peer.data of the new one.
reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe" |
		sed -n 's/.*"reload_zoned":{"zone":true.*/zoned/p'
}
